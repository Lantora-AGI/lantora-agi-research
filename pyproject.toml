[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lantora-eval"
version = "0.1.0"
description = "Provider-neutral evaluation harness for the Lantora AGI Research Program"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Lantora AGI Research Program"}]
dependencies = []

[project.scripts]
lantora-eval = "lantora_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

